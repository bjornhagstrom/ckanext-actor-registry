name: Feature request
description: Suggest a general improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the metadata-management need, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: standards
    attributes:
      label: Relevant standards or vocabularies
      description: For example DCAT, DCAT-AP, DCAT-AP-SE, FOAF or VCARD.
  - type: textarea
    id: generality
    attributes:
      label: Applicability beyond one portal
      description: Describe how the proposal remains useful across organizations and countries.
