services:
  tests:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@db/ckan_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1
      DCAT_AP_3_SHACL_PATH: /srv/app/test-data/dcat-ap-3.0.1-SHACL.ttl
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ckan_test
      POSTGRES_USER: ckan_default
      POSTGRES_PASSWORD: pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckan_default -d ckan_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  solr:
    platform: linux/amd64
    image: ckan/ckan-solr:2.11-solr9
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8983/solr/ckan/admin/ping >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7.2.5-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
